# Despliegue automático en GitHub Pages.
# Inyecta el OAuth Client ID desde el secreto del repositorio en cada push,
# de modo que el index.html del repo nunca tenga que editarse a mano.
#
# Requisitos, una sola vez:
#   Settings → Pages → Source: GitHub Actions
#   gh secret set GOOGLE_CLIENT_ID --body "TU-ID.apps.googleusercontent.com"

name: Deploy panel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inyectar OAuth Client ID
        env:
          CID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$CID" ]; then
            echo "::error::Falta el secreto GOOGLE_CLIENT_ID"
            exit 1
          fi
          mkdir -p _site
          cp index.html config.js _site/
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path("_site/config.js")
          s = p.read_text(encoding="utf-8")
          s, n = re.subn(r'clientId:\s*"[^"]*"',
                         'clientId: "%s"' % os.environ["CID"], s, count=1)
          assert n == 1, "No se encontró la clave clientId en config.js"
          p.write_text(s, encoding="utf-8")
          print("Client ID inyectado en config.js")
          PY
          [ -f CNAME ] && cp CNAME _site/ || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
